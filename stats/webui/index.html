<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>gitcontrib · statistics</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #2f81f7;
      --add: #3fb950;
      --del: #f85149;
      --hm0: #161b22;
      --hm1: #0e4429;
      --hm2: #006d32;
      --hm3: #26a641;
      --hm4: #39d353;
    }
    * { box-sizing: border-box; }
    /* A flex/grid display rule would otherwise win over the hidden attribute. */
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    header {
      padding: 24px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 20px; }
    header .sub { color: var(--muted); font-size: 13px; }
    header .titles { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    header .controls { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    button {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #58a6ff; }
    button:disabled { opacity: .6; cursor: default; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: middle; background: var(--add); }
    .dot.stale { background: var(--del); }
    .dot.refreshing { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    .spinner { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--accent); animation: spin .7s linear infinite; display: inline-block; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg .spinner { margin-right: 8px; }
    main { transition: opacity .2s ease; }
    body.busy main { opacity: .4; pointer-events: none; }

    /* Parameters form */
    #params-panel { padding: 16px 32px; border-bottom: 1px solid var(--border); background: var(--panel); }
    #params-form { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; width: 100%; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .field input[type=text], .field input[type=number], .field select {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 7px 9px; font-size: 13px;
    }
    .field select { min-width: 180px; }
    .field input[type=number] { width: 90px; }
    .field.check { flex-direction: row; align-items: center; gap: 6px; height: 34px; }
    .field.check label { text-transform: none; font-size: 13px; letter-spacing: 0; color: var(--text); }
    #params-form input:disabled { opacity: .5; }
    main { padding: 24px 32px; width: 100%; }
    .grid { display: grid; gap: 20px; }
    .cards { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    .panels { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    .card, .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
    }
    .card .value { font-size: 30px; font-weight: 600; }
    .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .panel h2 { margin: 0 0 16px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .section-title { margin: 0 0 12px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    section { margin-top: 24px; }

    /* Bar charts */
    .bars { display: flex; align-items: stretch; gap: 4px; height: 180px; }
    .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; height: 100%; }
    .bar-track { flex: 1; width: 100%; display: flex; align-items: flex-end; }
    .bar { width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; transition: height .3s; }
    .bar-label { font-size: 10px; color: var(--muted); white-space: nowrap; }
    .bar-wrap:hover .bar { background: #58a6ff; }

    /* Trend line chart */
    .trend { width: 100%; height: auto; display: block; }
    .trend .axis { fill: var(--muted); font-size: 10px; }
    .trend .band-even { fill: rgba(255, 255, 255, 0.06); }
    .trend .band-odd { fill: rgba(255, 255, 255, 0.015); }
    .lines-legend { display: flex; gap: 20px; color: var(--muted); font-size: 12px; margin-top: 8px; }
    .lines-legend span { display: inline-flex; align-items: center; }

    /* Calendar heatmap */
    .cal { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; grid-auto-columns: minmax(13px, 1fr); gap: 3px; width: 100%; height: 148px; overflow-x: auto; padding-bottom: 6px; }
    .cell { border-radius: 2px; background: var(--hm0); }
    .legend { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; margin-top: 10px; }
    .legend .cell { width: 11px; height: 11px; flex: none; }

    /* Punchcard (weekday x hour) */
    .punch { display: grid; grid-template-columns: auto repeat(24, 1fr); gap: 3px; align-items: center; overflow-x: auto; }
    .punch-hour { font-size: 10px; color: var(--muted); text-align: center; }
    .punch-day { font-size: 11px; color: var(--muted); padding-right: 8px; text-align: right; white-space: nowrap; }
    .punch-cell { aspect-ratio: 1; border-radius: 2px; background: var(--hm0); min-width: 8px; }

    /* Contributors */
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
    th { color: var(--muted); font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: .04em; }
    tbody tr { transition: background .15s ease; }
    tbody tr:hover { background: rgba(255, 255, 255, 0.05); }
    tbody tr.clickable { cursor: pointer; }
    .table-scroll { max-height: 620px; overflow-y: auto; }
    thead th { position: sticky; top: 0; background: var(--panel); border-bottom: none; box-shadow: inset 0 -1px 0 var(--border); z-index: 1; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .add { color: var(--add); }
    .del { color: var(--del); }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 8px; vertical-align: middle; }

    .donut-wrap { display: flex; flex-direction: column; gap: 20px; align-items: center; justify-content: center; }
    .donut { width: min(100%, 360px); height: auto; aspect-ratio: 1 / 1; }
    .donut-legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px 20px; font-size: 13px; width: 100%; }
    .donut-legend div { display: flex; align-items: center; min-width: 0; }
    .donut-legend .swatch { flex: none; }
    .donut-legend div span:not(.swatch) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Settings dialog */
    .modal { position: fixed; inset: 0; z-index: 50; background: rgba(1, 4, 9, .72); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
    .modal-card { display: flex; flex-direction: column; width: 760px; max-width: 100%; max-height: calc(100vh - 80px); background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 20px 60px rgba(0, 0, 0, .6); }
    .modal-head { display: flex; align-items: baseline; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .modal-head h2 { margin: 0; font-size: 16px; }
    .modal-head .sub { margin-left: auto; max-width: 60%; overflow: hidden; white-space: nowrap; }
    .modal-body { display: flex; flex-direction: column; gap: 22px; padding: 18px 20px; overflow-y: auto; }
    .modal-foot { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-top: 1px solid var(--border); }
    button.icon { background: none; border: 0; color: var(--muted); font-size: 20px; line-height: 1; padding: 0 4px; cursor: pointer; }
    button.icon:hover:not(:disabled) { background: none; color: var(--text); }
    .sgroup h3 { margin: 0 0 10px; font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .sgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px 16px; }
    .sfield { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .sfield > label { font-size: 12px; color: var(--muted); }
    .sfield input[type=text], .sfield input[type=number], .sfield input[type=password] { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; font-size: 13px; }
    .sfield input:disabled { opacity: .5; }
    .sfield .hint { font-size: 11px; color: var(--muted); }
    .sfield.check { flex-direction: row; align-items: center; gap: 8px; }
    .sfield.check > label { color: var(--text); font-size: 13px; }
    .srow { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; border-bottom: 1px dashed rgba(255, 255, 255, .06); }
    .srow .path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .srow .ro { color: var(--muted); }
    .srow input[type=text], .srow input[type=password] { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; font-size: 13px; }
    .sgroup .hint { display: block; margin-top: 8px; font-size: 11px; color: var(--muted); }
    .notice { border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 6px; padding: 10px 12px; font-size: 12px; color: var(--muted); background: var(--bg); }
    .notice.warn { border-left-color: var(--del); }
    .notice code, .notice b { color: var(--text); }
    .settings-msg { flex: 1; font-size: 12px; color: var(--muted); }
    .settings-msg.error { color: var(--del); }
    .settings-msg.ok { color: var(--add); }

    /* Repository picker */
    .picker { position: relative; }
    .picker-btn { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 7px 26px 7px 9px; font-size: 13px; font-weight: 400; text-align: left; min-width: 200px; max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .picker-btn::after { content: '▾'; position: absolute; right: 9px; color: var(--muted); }
    .picker-btn:hover:not(:disabled), .picker-btn[aria-expanded=true] { background: var(--panel); border-color: var(--accent); }
    .picker-panel { position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; width: 420px; max-width: 90vw; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 28px rgba(0, 0, 0, .55); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .picker-row { display: flex; align-items: center; gap: 8px; }
    .picker-row input[type=text] { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; font-size: 13px; }
    .picker-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
    .picker-section { border-top: 1px solid var(--border); padding-top: 10px; }
    .picker-list { max-height: 260px; overflow-y: auto; border-top: 1px solid var(--border); padding-top: 8px; display: flex; flex-direction: column; }
    .field .picker-item { display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-radius: 4px; cursor: pointer; font-size: 13px; color: var(--text); text-transform: none; letter-spacing: 0; }
    .picker-item:hover { background: rgba(255, 255, 255, .05); }
    .picker-item input { cursor: pointer; }
    .picker-item .name { flex: none; }
    .picker-item .path { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .picker-empty { color: var(--muted); font-size: 12px; padding: 8px 4px; }
    .picker-foot { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
    .picker-count { color: var(--muted); font-size: 12px; margin-right: auto; }
    .picker-error { color: var(--del); font-size: 12px; }
    button.link { background: none; border: 0; color: var(--accent); padding: 2px 4px; font-size: 12px; font-weight: 500; }
    button.link:hover:not(:disabled) { background: none; text-decoration: underline; }
    .chip.group { cursor: pointer; padding-right: 4px; }
    .chip.group:hover { border-color: var(--accent); color: var(--text); }
    .chip.group.on { border-color: var(--accent); color: var(--text); }
    .chip.group .del { border: 0; background: none; color: var(--muted); padding: 0 4px; font-size: 13px; line-height: 1; cursor: pointer; }
    .chip.group .del:hover { background: none; color: var(--del); }

    /* Identity cards */
    .idgrid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }
    .idcard { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
    .idcard.all { border-color: var(--accent); }
    .idhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .idname { margin: 0; font-size: 16px; font-weight: 600; }
    .idname button { background: none; border: 0; padding: 0; font: inherit; color: var(--text); cursor: pointer; }
    .idname button { text-decoration: underline dotted; text-underline-offset: 3px; }
    .idname button:hover { background: none; color: var(--accent); }
    .chip.branch { max-width: 220px; }
    .idmeta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .idmeta + .idmeta { margin-top: 2px; }
    .idchips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; font-size: 11px; color: var(--muted); background: var(--bg); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .chip b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
    .idcols { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
    .idgroup h4 { margin: 0 0 6px; font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .idrow { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; font-size: 13px; border-bottom: 1px dashed rgba(255, 255, 255, 0.06); }
    .idrow:last-child { border-bottom: 0; }
    .idrow .k { color: var(--muted); flex: none; }
    .idrow .v { font-variant-numeric: tabular-nums; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .langbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--bg); }
    .idlegend { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
    .idlegend span.item { display: inline-flex; align-items: center; }
    .iderr { color: var(--del); font-size: 12px; }

    .msg { color: var(--muted); padding: 40px; text-align: center; }
    .empty { text-align: center; padding: 36px 16px 8px; color: var(--muted); }
    .empty h2 { margin: 0 0 10px; font-size: 18px; color: var(--text); }
    .empty p { margin: 0 auto 6px; max-width: 680px; font-size: 13px; }
    .empty .filters { color: var(--text); }
    .empty .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="titles">
      <h1>gitcontrib</h1>
      <span class="sub" id="scan-info">loading…</span>
    </div>
    <div class="controls">
      <span id="loader" class="spinner" style="display:none"></span>
      <span class="sub" id="cache-info"></span>
      <button id="settings-btn" type="button">Settings</button>
      <button id="export-btn" type="button">Export JSON</button>
      <button id="refresh-btn" type="button">Refresh</button>
    </div>
  </header>

  <section id="params-panel">
    <form id="params-form">
      <div class="field" id="repo-field" style="display:none">
        <label>Repositories</label>
        <div class="picker">
          <button type="button" id="repo-btn" class="picker-btn" aria-haspopup="true" aria-expanded="false">All repositories</button>
          <div class="picker-panel" id="repo-panel" hidden>
            <div class="picker-row">
              <input type="text" id="repo-search" placeholder="Filter repositories…" />
              <button type="button" class="link" id="repo-all">All</button>
              <button type="button" class="link" id="repo-none">None</button>
            </div>
            <div class="picker-section" id="repo-groups-section">
              <div class="picker-label">Groups</div>
              <div class="idchips" id="repo-groups"></div>
            </div>
            <div class="picker-list" id="repo-list"></div>
            <div class="picker-error" id="repo-error" hidden></div>
            <div class="picker-row" id="group-save-row" hidden>
              <input type="text" id="group-name" placeholder="Group name" />
              <button type="button" id="group-save">Save</button>
              <button type="button" class="link" id="group-cancel">Cancel</button>
            </div>
            <div class="picker-foot">
              <span class="picker-count" id="repo-count"></span>
              <button type="button" class="link" id="group-save-toggle">Save as group…</button>
              <button type="button" id="repo-apply">Apply</button>
            </div>
          </div>
        </div>
      </div>
      <div class="field">
        <label for="f-weeks">Weeks</label>
        <input type="number" id="f-weeks" min="1" max="520" />
      </div>
      <div class="field">
        <label for="f-delta">Delta</label>
        <input type="text" id="f-delta" placeholder="e.g. 1y, 6m, 2w" size="10" />
      </div>
      <div class="field">
        <label for="f-user">User (name or email)</label>
        <input type="text" id="f-user" placeholder="all users" size="24" />
      </div>
      <div class="field check">
        <input type="checkbox" id="f-countall" />
        <label for="f-countall">All users</label>
      </div>
      <div class="field">
        <label for="f-include">Include patterns</label>
        <input type="text" id="f-include" placeholder="regex, comma-separated" size="20" />
      </div>
      <div class="field">
        <label for="f-exclude">Exclude patterns</label>
        <input type="text" id="f-exclude" placeholder="regex, comma-separated" size="20" />
      </div>
      <button id="apply-btn" type="submit">Apply</button>
    </form>
  </section>

  <main id="app">
    <p class="msg"><span class="spinner"></span>Analyzing commits…</p>
  </main>

  <div class="modal" id="settings" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-head">
        <h2 id="settings-title">Settings</h2>
        <span class="sub" id="settings-file"></span>
        <button type="button" class="icon" id="settings-close" title="Close">×</button>
      </div>
      <div class="modal-body" id="settings-body"></div>
      <div class="modal-foot">
        <span class="settings-msg" id="settings-msg"></span>
        <button type="button" class="link" id="settings-cancel">Close</button>
        <button type="button" id="settings-save">Save</button>
      </div>
    </div>
  </div>

  <script>
    const PALETTE = ['#f85149', '#3fb950', '#d29922', '#2f81f7', '#bc8cff', '#39c5cf', '#e6edf3'];

    function el(tag, attrs = {}, children = []) {
      const e = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === 'class') e.className = v;
        else if (k === 'style') e.style.cssText = v;
        else if (k === 'html') e.innerHTML = v;
        else e.setAttribute(k, v);
      }
      for (const c of [].concat(children)) {
        if (c == null) continue;
        e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      }
      return e;
    }

    function card(value, label, title) {
      const c = el('div', { class: 'card' }, [
        el('div', { class: 'value' }, String(value)),
        el('div', { class: 'label' }, label),
      ]);
      if (title) c.title = title;
      return c;
    }

    function argmax(arr) {
      let best = 0;
      for (let i = 1; i < arr.length; i++) if (arr[i] > arr[best]) best = i;
      return best;
    }

    // computeHighlights derives at-a-glance insight tiles from the response.
    function computeHighlights(data) {
      const cal = data.calendar || [];
      let longest = 0, run = 0;
      for (const d of cal) { run = d.count > 0 ? run + 1 : 0; if (run > longest) longest = run; }
      // Current streak: count back from the last non-future day (the calendar
      // extends to the end of the week, so trailing days may be in the future).
      const now = new Date();
      const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      let end = cal.length - 1;
      while (end >= 0 && cal[end].date > todayStr) end--;
      let current = 0;
      for (let i = end; i >= 0 && cal[i].count > 0; i--) current++;
      let busiest = null;
      for (const d of cal) if (d.count > 0 && (!busiest || d.count > busiest.count)) busiest = d;

      const wd = data.commitsByWeekday || [], hr = data.commitsByHour || [];
      const wdNames = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
      const contribs = data.contributors || [];
      const totalLines = contribs.reduce((s, c) => s + c.total, 0);
      const days = n => `${n} day${n === 1 ? '' : 's'}`;

      const tiles = [];
      tiles.push(card(days(longest), 'Longest streak'));
      tiles.push(card(days(current), 'Current streak'));
      if (wd.length && wd[argmax(wd)] > 0) tiles.push(card(wdNames[argmax(wd)], 'Most active day'));
      if (hr.length && hr[argmax(hr)] > 0) tiles.push(card(String(argmax(hr)).padStart(2, '0') + ':00', 'Peak hour'));
      if (busiest) tiles.push(card(busiest.count, `Busiest day (${shortDate(busiest.date)})`, busiest.date));
      if (data.totalCommits) tiles.push(card(Math.round(totalLines / data.totalCommits), 'Avg lines / commit'));
      if (contribs.length && totalLines > 0) {
        tiles.push(card(Math.round(contribs[0].total / totalLines * 100) + '%', 'Top contributor share', contribs[0].author));
      }
      return tiles;
    }

    // scrollable wraps a table so it scrolls vertically past a max height while
    // its header stays pinned (via sticky th).
    function scrollable(node) {
      return el('div', { class: 'table-scroll' }, [node]);
    }

    function barChart(data, labels) {
      const max = Math.max(1, ...data);
      const bars = data.map((v, i) => el('div', { class: 'bar-wrap', title: `${labels[i]}: ${v}` }, [
        el('div', { class: 'bar-track' }, [
          el('div', { class: 'bar', style: `height:${(v / max) * 100}%` }),
        ]),
        el('div', { class: 'bar-label' }, labels[i]),
      ]));
      return el('div', { class: 'bars' }, bars);
    }

    function heatColor(count) {
      if (count <= 0) return 'var(--hm0)';
      if (count < 3) return 'var(--hm1)';
      if (count < 6) return 'var(--hm2)';
      if (count < 10) return 'var(--hm3)';
      return 'var(--hm4)';
    }

    function calendar(days) {
      const cal = el('div', { class: 'cal' });
      days.forEach((d, i) => {
        const cell = el('div', {
          class: 'cell',
          title: `${d.date}: ${d.count} commit${d.count === 1 ? '' : 's'}`,
          style: `background:${heatColor(d.count)}`,
        });
        // Offset the first cell to its weekday row (grid rows are Sunday-first).
        if (i === 0) cell.style.gridRowStart = d.weekday + 1;
        cal.appendChild(cell);
      });
      const legend = el('div', { class: 'legend' }, ['Less']);
      ['var(--hm0)', 'var(--hm1)', 'var(--hm2)', 'var(--hm3)', 'var(--hm4)'].forEach(c =>
        legend.appendChild(el('div', { class: 'cell', style: `background:${c}` })));
      legend.appendChild(document.createTextNode('More'));
      return el('div', {}, [cal, legend]);
    }

    // punchcardChart draws a weekday x hour grid heatmap from a [7][24] matrix
    // (rows Monday-first).
    function punchcardChart(matrix) {
      const wdNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      const grid = el('div', { class: 'punch' });
      grid.appendChild(el('div', {}));  // top-left corner
      for (let h = 0; h < 24; h++) {
        grid.appendChild(el('div', { class: 'punch-hour' }, h % 2 === 0 ? String(h) : ''));
      }
      for (let d = 0; d < 7; d++) {
        grid.appendChild(el('div', { class: 'punch-day' }, wdNames[d]));
        for (let h = 0; h < 24; h++) {
          const count = (matrix[d] || [])[h] || 0;
          grid.appendChild(el('div', {
            class: 'punch-cell',
            title: `${wdNames[d]} ${String(h).padStart(2, '0')}:00 — ${count} commit${count === 1 ? '' : 's'}`,
            style: `background:${heatColor(count)}`,
          }));
        }
      }
      return grid;
    }

    // donutChart draws a donut from items of the form {label, value}.
    function donutChart(items) {
      const total = items.reduce((s, it) => s + it.value, 0);
      const NS = 'http://www.w3.org/2000/svg';
      const size = 160, r = 60, cx = size / 2, cy = size / 2;
      const circ = 2 * Math.PI * r;
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'donut');
      svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
      let offset = 0;
      items.forEach((it, i) => {
        if (total <= 0) return;
        const frac = it.value / total;
        const seg = document.createElementNS(NS, 'circle');
        seg.setAttribute('cx', cx);
        seg.setAttribute('cy', cy);
        seg.setAttribute('r', r);
        seg.setAttribute('fill', 'none');
        seg.setAttribute('stroke', PALETTE[i % PALETTE.length]);
        seg.setAttribute('stroke-width', 24);
        seg.setAttribute('stroke-dasharray', `${frac * circ} ${circ - frac * circ}`);
        seg.setAttribute('stroke-dashoffset', -offset);
        seg.setAttribute('transform', `rotate(-90 ${cx} ${cy})`);
        svg.appendChild(seg);
        offset += frac * circ;
      });
      const legend = el('div', { class: 'donut-legend' },
        items.map((it, i) => el('div', { title: `${it.label} (${it.value})` }, [
          el('span', { class: 'swatch', style: `background:${PALETTE[i % PALETTE.length]}` }),
          el('span', {}, `${it.label} (${it.value})`),
        ])));
      return el('div', { class: 'donut-wrap' }, [svg, legend]);
    }

    // editionsTable builds a scrollable +/- table from rows that expose a label
    // getter plus additions/deletions/total. When onClick is provided, rows are
    // clickable.
    function editionsTable(rows, labelHeader, labelOf, onClick) {
      const body = rows.map((row, i) => {
        const tr = el('tr', {}, [
          el('td', {}, [
            el('span', { class: 'swatch', style: `background:${PALETTE[i % PALETTE.length]}` }),
            labelOf(row),
          ]),
          el('td', { class: 'num add' }, `+${row.additions}`),
          el('td', { class: 'num del' }, `-${row.deletions}`),
          el('td', { class: 'num' }, String(row.total)),
        ]);
        if (onClick) {
          tr.className = 'clickable';
          tr.title = 'Filter on this contributor';
          tr.addEventListener('click', () => onClick(row));
        }
        return tr;
      });
      const head = el('tr', {}, [
        el('th', {}, labelHeader),
        el('th', { class: 'num' }, 'Additions'),
        el('th', { class: 'num' }, 'Deletions'),
        el('th', { class: 'num' }, 'Total'),
      ]);
      return scrollable(el('table', {}, [el('thead', {}, head), el('tbody', {}, body)]));
    }

    // countTable builds a scrollable two-column table (label + count) with a
    // colored swatch matching the donut segments.
    function countTable(rows, labelHeader, countHeader, labelOf, countOf) {
      const body = rows.map((row, i) => el('tr', {}, [
        el('td', {}, [
          el('span', { class: 'swatch', style: `background:${PALETTE[i % PALETTE.length]}` }),
          labelOf(row),
        ]),
        el('td', { class: 'num' }, String(countOf(row))),
      ]));
      const head = el('tr', {}, [
        el('th', {}, labelHeader),
        el('th', { class: 'num' }, countHeader),
      ]);
      return scrollable(el('table', {}, [el('thead', {}, head), el('tbody', {}, body)]));
    }

    function panel(title, body) {
      return el('div', { class: 'panel' }, [el('h2', {}, title), body]);
    }

    function fmtDate(iso) {
      return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function svgNode(tag, attrs) {
      const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
      return n;
    }

    // weeklyTrend buckets the daily calendar (which starts on a Monday) into
    // weekly commit totals.
    function weeklyTrend(days) {
      const weeks = [];
      for (let i = 0; i < days.length; i += 7) {
        const chunk = days.slice(i, i + 7);
        weeks.push({ date: chunk[0].date, value: chunk.reduce((s, d) => s + d.count, 0) });
      }
      return weeks;
    }

    function shortDate(iso) {
      return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    // trendChart draws an area+line chart of commits over time, one column per
    // week with alternating (even/odd) background bands and dated x-axis ticks.
    function trendChart(points) {
      const w = 900, h = 220, padL = 8, padR = 8, padT = 14, padB = 30;
      const innerW = w - padL - padR, innerH = h - padT - padB;
      const max = Math.max(1, ...points.map(p => p.value));
      const n = points.length;
      const step = innerW / n;
      const xc = i => padL + (i + 0.5) * step;      // week column center
      const y = v => padT + innerH - (v / max) * innerH;
      const baseline = padT + innerH;

      const svg = svgNode('svg', { class: 'trend', viewBox: `0 0 ${w} ${h}`, preserveAspectRatio: 'none' });

      // Alternating weekly bands (also carry the hover tooltip).
      points.forEach((p, i) => {
        const band = svgNode('rect', {
          x: (padL + i * step).toFixed(2), y: padT, width: step.toFixed(2), height: innerH,
          class: i % 2 === 0 ? 'band-even' : 'band-odd',
        });
        band.appendChild(svgNode('title', {})).textContent =
          `${fmtDate(p.date)}: ${p.value} commit${p.value === 1 ? '' : 's'}`;
        svg.appendChild(band);
      });

      // Area + line.
      const line = points.map((p, i) => `${i ? 'L' : 'M'}${xc(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
      const area = `${line} L${xc(n - 1).toFixed(1)},${baseline.toFixed(1)} L${xc(0).toFixed(1)},${baseline.toFixed(1)} Z`;
      svg.appendChild(svgNode('path', { d: area, fill: 'var(--accent)', 'fill-opacity': '0.15', stroke: 'none' }));
      svg.appendChild(svgNode('path', { d: line, fill: 'none', stroke: 'var(--accent)', 'stroke-width': '2', 'stroke-linejoin': 'round' }));

      // Data points.
      points.forEach((p, i) => {
        const dot = svgNode('circle', { cx: xc(i).toFixed(1), cy: y(p.value).toFixed(1), r: '2.5', fill: 'var(--accent)' });
        dot.appendChild(svgNode('title', {})).textContent =
          `${fmtDate(p.date)}: ${p.value} commit${p.value === 1 ? '' : 's'}`;
        svg.appendChild(dot);
      });

      // Max label (top-left).
      const maxLabel = svgNode('text', { class: 'axis', x: padL, y: padT - 3 });
      maxLabel.textContent = `max ${max}`;
      svg.appendChild(maxLabel);

      // Dated x-axis ticks at regular intervals (about ten labels), plus the last.
      const every = Math.max(1, Math.ceil(n / 10));
      for (let i = 0; i < n; i++) {
        if (i % every !== 0 && i !== n - 1) continue;
        const t = svgNode('text', { class: 'axis', x: xc(i).toFixed(1), y: h - 9, 'text-anchor': 'middle' });
        t.textContent = shortDate(points[i].date);
        svg.appendChild(t);
      }

      return svg;
    }

    // weeklyLines buckets the daily calendar into weekly additions/deletions.
    function weeklyLines(days) {
      const weeks = [];
      for (let i = 0; i < days.length; i += 7) {
        const chunk = days.slice(i, i + 7);
        weeks.push({
          date: chunk[0].date,
          additions: chunk.reduce((s, d) => s + d.additions, 0),
          deletions: chunk.reduce((s, d) => s + d.deletions, 0),
        });
      }
      return weeks;
    }

    // linesChart draws a diverging chart: additions above the baseline (green),
    // deletions below (red), one bar per week.
    function linesChart(points) {
      const w = 900, h = 220, padL = 8, padR = 8, padT = 16, padB = 24;
      const innerW = w - padL - padR, innerH = h - padT - padB;
      const maxVal = Math.max(1, ...points.map(p => Math.max(p.additions, p.deletions)));
      const n = points.length;
      const step = innerW / n;
      const zeroY = padT + innerH / 2;
      const scale = v => (v / maxVal) * (innerH / 2);
      const barW = step * 0.7, gap = step * 0.15;

      const svg = svgNode('svg', { class: 'trend', viewBox: `0 0 ${w} ${h}`, preserveAspectRatio: 'none' });

      points.forEach((p, i) => {
        const x = (padL + i * step + gap).toFixed(2);
        const aH = scale(p.additions), dH = scale(p.deletions);
        const g = svgNode('g', {});
        const title = svgNode('title', {});
        title.textContent = `${fmtDate(p.date)}: +${p.additions} / -${p.deletions}`;
        g.appendChild(title);
        if (aH > 0) g.appendChild(svgNode('rect', { x, y: (zeroY - aH).toFixed(2), width: barW.toFixed(2), height: aH.toFixed(2), fill: 'var(--add)' }));
        if (dH > 0) g.appendChild(svgNode('rect', { x, y: zeroY.toFixed(2), width: barW.toFixed(2), height: dH.toFixed(2), fill: 'var(--del)' }));
        svg.appendChild(g);
      });

      // Zero baseline.
      svg.appendChild(svgNode('line', { x1: padL, y1: zeroY.toFixed(2), x2: w - padR, y2: zeroY.toFixed(2), stroke: 'var(--border)', 'stroke-width': '1' }));

      // Scale label.
      const scaleLabel = svgNode('text', { class: 'axis', x: padL, y: padT - 4 });
      scaleLabel.textContent = `±${maxVal} lines / week`;
      svg.appendChild(scaleLabel);

      // Dated x-axis ticks.
      const every = Math.max(1, Math.ceil(n / 10));
      for (let i = 0; i < n; i++) {
        if (i % every !== 0 && i !== n - 1) continue;
        const t = svgNode('text', { class: 'axis', x: (padL + i * step + step / 2).toFixed(1), y: h - 9, 'text-anchor': 'middle' });
        t.textContent = shortDate(points[i].date);
        svg.appendChild(t);
      }

      const legend = el('div', { class: 'lines-legend' }, [
        el('span', {}, [el('span', { class: 'swatch', style: 'background:var(--add)' }), 'Additions']),
        el('span', {}, [el('span', { class: 'swatch', style: 'background:var(--del)' }), 'Deletions']),
      ]);
      return el('div', {}, [svg, legend]);
    }

    function relativeTime(iso) {
      const secs = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
      if (secs < 60) return 'just now';
      if (secs < 3600) return Math.floor(secs / 60) + ' min ago';
      if (secs < 86400) return Math.floor(secs / 3600) + ' h ago';
      return Math.floor(secs / 86400) + ' d ago';
    }

    function updateStatusBar(data) {
      const btn = document.getElementById('refresh-btn');
      btn.disabled = !!data.refreshing;
      btn.textContent = data.refreshing ? 'Refreshing…' : 'Refresh';

      let cls = 'dot';
      if (data.refreshing) cls += ' refreshing';
      else if (data.stale) cls += ' stale';
      const state = data.refreshing ? 'refreshing' : (data.stale ? 'stale' : 'up to date');
      const when = new Date(data.updatedAt).toLocaleString();
      document.getElementById('cache-info').innerHTML =
        `<span class="${cls}"></span>updated ${when} (${relativeTime(data.updatedAt)}) · ${state}`;
    }

    let pollTimer = null;
    let availableRepos = [];   // every scanned folder, in the configured order
    let selectedRepos = [];    // the analyzed subset; empty means all of them
    let pendingRepos = [];     // the selection being edited in the picker
    let repoGroups = [];       // saved selections, [{name, repositories}]
    let configData = null;     // the last /api/config answer
    let configDraft = null;    // the configuration being edited in the dialog
    let identityTimer = null;
    let identityData = null;
    let identityError = null;
    let identityRepo = null;
    let currentQuery = '';
    let formInitialized = false;
    let lastData = null;

    function scheduleAutoRefreshCheck(data) {
      clearTimeout(pollTimer);
      // Keep polling while a background refresh is running, then render fresh data.
      if (data.refreshing) {
        pollTimer = setTimeout(() => loadStats().catch(showError), 2000);
      }
    }

    // setBusy shows the loader and dims the content while an analysis runs.
    function setBusy(busy) {
      document.body.classList.toggle('busy', busy);
      document.getElementById('loader').style.display = busy ? 'inline-block' : 'none';
    }

    function loadStats() {
      setBusy(true);
      return fetch('api/stats' + currentQuery)
        .then(r => {
          if (!r.ok) return r.text().then(t => { throw new Error(t.trim() || ('HTTP ' + r.status)); });
          return r.json();
        })
        .then(
          // Keep the loader on while a background refresh is still running.
          data => { render(data); setBusy(!!data.refreshing); return data; },
          err => { setBusy(false); throw err; }
        );
    }

    function triggerRefresh() {
      const btn = document.getElementById('refresh-btn');
      btn.disabled = true;
      btn.textContent = 'Refreshing…';
      setBusy(true);
      fetch('api/refresh' + currentQuery, { method: 'POST' })
        .then(() => { loadIdentity(); return loadStats(); })
        .catch(err => { setBusy(false); showError(err); });
    }

    // Build the query string from the parameters form. The repository
    // selection goes in it too, so the page URL always describes the view and
    // can be shared as is: a saved selection travels as its group name, any
    // other one as a "repo" parameter per repository.
    function buildQuery() {
      const val = id => document.getElementById(id).value.trim();
      const checked = id => document.getElementById(id).checked;
      const params = new URLSearchParams();
      if (selectedRepos.length && selectedRepos.length < availableRepos.length) {
        const group = matchingGroup(selectedRepos);
        if (group) params.set('group', group);
        else selectedRepos.forEach(repo => params.append('repo', repo));
      }
      if (val('f-weeks')) params.set('weeks', val('f-weeks'));
      if (val('f-delta')) params.set('delta', val('f-delta'));
      const countAll = checked('f-countall');
      if (!countAll && val('f-user')) params.set('user', val('f-user'));
      params.set('countAll', countAll ? 'true' : 'false');
      if (val('f-include')) params.set('include', val('f-include'));
      if (val('f-exclude')) params.set('exclude', val('f-exclude'));
      const s = params.toString();
      return s ? '?' + s : '';
    }

    // Fill the form with the server defaults once, then leave the user in control.
    function populateForm(data) {
      if (formInitialized || !data || !data.params) return;
      formInitialized = true;
      const p = data.params;
      initRepoPicker(data.availableRepos || [], p.repos || []);
      document.getElementById('f-weeks').value = p.weeks || '';
      document.getElementById('f-delta').value = p.delta || '';
      document.getElementById('f-user').value = p.user || '';
      document.getElementById('f-countall').checked = !!p.countAll;
      document.getElementById('f-include').value = (p.include || []).join(', ');
      document.getElementById('f-exclude').value = (p.exclude || []).join(', ');
      syncUserField();
    }

    // ---- Repository picker ------------------------------------------------
    // A multiple selection of the scanned folders, recallable as a named group.
    // The picker is hidden when there is only one repository to choose from.

    function repoLabel(folder) {
      return folder.split('/').filter(Boolean).pop() || folder;
    }

    // initRepoPicker adopts the folders the server scans and the selection it
    // applied (a link may carry one), then draws the picker.
    function initRepoPicker(repos, selected) {
      availableRepos = repos;
      selectedRepos = (selected || []).filter(r => repos.includes(r));
      document.getElementById('repo-field').style.display = repos.length < 2 ? 'none' : '';
      renderRepoPicker();
    }

    // syncAvailableRepos follows the repositories the server scans, which a
    // configuration saved from the settings dialog can change while the page
    // is open. A selected repository that is gone drops out of the selection.
    function syncAvailableRepos(repos) {
      if (sameList(availableRepos, repos)) return;
      availableRepos = repos;
      selectedRepos = selectedRepos.filter(r => repos.includes(r));
      document.getElementById('repo-field').style.display = repos.length < 2 ? 'none' : '';
      renderRepoPicker();
    }

    // matchingGroup names the group a selection reproduces, so it can travel as
    // a group name rather than as a list of paths.
    function matchingGroup(selection) {
      const wanted = new Set(selection);
      const match = repoGroups.find(g => {
        const repos = (g.repositories || []).filter(r => availableRepos.includes(r));
        return repos.length === wanted.size && repos.every(r => wanted.has(r));
      });
      return match ? match.name : '';
    }

    function repoButtonLabel() {
      if (!selectedRepos.length || selectedRepos.length === availableRepos.length) {
        return `All repositories (${availableRepos.length})`;
      }
      const group = matchingGroup(selectedRepos);
      if (group) return `${group} (${selectedRepos.length})`;
      if (selectedRepos.length === 1) return repoLabel(selectedRepos[0]);
      return `${selectedRepos.length} of ${availableRepos.length} repositories`;
    }

    // renderRepoPicker redraws the button and, when it is open, the panel.
    function renderRepoPicker() {
      const button = document.getElementById('repo-btn');
      button.textContent = repoButtonLabel();
      button.title = selectedRepos.length ? selectedRepos.join('\n') : 'Every scanned repository';
      if (!document.getElementById('repo-panel').hidden) renderRepoPanel();
    }

    function renderRepoPanel() {
      const filter = document.getElementById('repo-search').value.trim().toLowerCase();
      const list = document.getElementById('repo-list');
      const scroll = list.scrollTop;
      list.innerHTML = '';

      const shown = availableRepos.filter(r => !filter || r.toLowerCase().includes(filter));
      if (!shown.length) {
        list.appendChild(el('div', { class: 'picker-empty' }, 'No repository matches this filter.'));
      }
      shown.forEach(repo => {
        const box = el('input', { type: 'checkbox' });
        box.checked = pendingRepos.includes(repo);
        box.addEventListener('change', () => toggleRepo(repo, box.checked));
        const item = el('label', { class: 'picker-item', title: repo }, [
          box,
          el('span', { class: 'name' }, repoLabel(repo)),
          el('span', { class: 'path' }, repo),
        ]);
        list.appendChild(item);
      });
      list.scrollTop = scroll;

      renderPickerMeta();
    }

    // renderPickerMeta redraws what a change of selection affects outside the
    // list itself: the group chips and the counter.
    function renderPickerMeta() {
      renderGroupChips();
      const count = pendingRepos.length;
      document.getElementById('repo-count').textContent = count
        ? `${count} of ${availableRepos.length} selected`
        : 'Nothing selected: every repository';
    }

    // renderGroupChips lists the saved groups: a chip applies its selection,
    // its × forgets the group.
    function renderGroupChips() {
      const box = document.getElementById('repo-groups');
      box.innerHTML = '';
      if (!repoGroups.length) {
        box.appendChild(el('span', { class: 'picker-empty' },
          'No group yet. Pick repositories, then "Save as group…".'));
        return;
      }
      const current = matchingGroup(pendingRepos);
      repoGroups.forEach(group => {
        const available = (group.repositories || []).filter(r => availableRepos.includes(r));
        const pick = el('span', {}, `${group.name} (${available.length})`);
        pick.addEventListener('click', () => {
          pendingRepos = available;
          renderRepoPanel();
        });
        const del = el('button', { type: 'button', class: 'del', title: `Delete the group ${group.name}` }, '×');
        del.addEventListener('click', event => {
          event.stopPropagation();
          deleteGroup(group.name);
        });
        const c = chip([pick, del], group.repositories.join('\n'));
        c.className = 'chip group' + (group.name === current ? ' on' : '');
        box.appendChild(c);
      });
    }

    // toggleRepo follows a ticked box; the box already shows the new state, so
    // only what depends on the whole selection is redrawn.
    function toggleRepo(repo, on) {
      pendingRepos = on
        ? availableRepos.filter(r => r === repo || pendingRepos.includes(r))
        : pendingRepos.filter(r => r !== repo);
      renderPickerMeta();
    }

    function openRepoPanel() {
      pendingRepos = selectedRepos.slice();
      document.getElementById('repo-search').value = '';
      showGroupNameRow(false);
      showPickerError('');
      document.getElementById('repo-panel').hidden = false;
      document.getElementById('repo-btn').setAttribute('aria-expanded', 'true');
      renderRepoPanel();
      document.getElementById('repo-search').focus();
    }

    function closeRepoPanel() {
      document.getElementById('repo-panel').hidden = true;
      document.getElementById('repo-btn').setAttribute('aria-expanded', 'false');
    }

    function toggleRepoPanel() {
      if (document.getElementById('repo-panel').hidden) openRepoPanel();
      else closeRepoPanel();
    }

    // applyRepoSelection narrows the whole page — statistics and identity
    // cards — to the repositories ticked in the panel.
    function applyRepoSelection() {
      selectedRepos = pendingRepos.length === availableRepos.length ? [] : pendingRepos.slice();
      closeRepoPanel();
      renderRepoPicker();
      applyParams();
    }

    // focusRepos narrows the analysis to the given repositories, from outside
    // the picker (an identity card, for instance).
    function focusRepos(repos) {
      selectedRepos = availableRepos.filter(r => repos.includes(r));
      renderRepoPicker();
      applyParams();
    }

    function showPickerError(message) {
      const box = document.getElementById('repo-error');
      box.textContent = message;
      box.hidden = !message;
    }

    function showGroupNameRow(show) {
      document.getElementById('group-save-row').hidden = !show;
      if (show) {
        const input = document.getElementById('group-name');
        input.value = matchingGroup(pendingRepos);
        input.focus();
        input.select();
      }
    }

    // ---- Repository groups --------------------------------------------------
    // Groups live in a JSON file on the server; the UI always sends the whole
    // list back, so one request keeps the file and the page in step.

    function loadGroups() {
      return fetch('api/groups')
        .then(r => (r.ok ? r.json() : null))
        .then(data => {
          if (data) {
            repoGroups = data.groups || [];
            if (data.file) {
              document.querySelector('#repo-groups-section .picker-label').title =
                'Saved in ' + data.file;
            }
            renderRepoPicker();
          }
        })
        .catch(() => { /* groups are optional: the picker works without them */ });
    }

    function saveGroups(groups) {
      return fetch('api/groups', {
        method: 'PUT',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ groups }),
      }).then(r => {
        if (r.status === 401 || r.status === 403) {
          return r.text().then(t => {
            throw new Error((t.trim() || 'not allowed') + ' — see Settings.');
          });
        }
        if (!r.ok) return r.text().then(t => { throw new Error(t.trim() || ('HTTP ' + r.status)); });
        return r.json();
      }).then(data => {
        repoGroups = data.groups || [];
        showPickerError('');
        renderRepoPicker();
      }).catch(err => showPickerError('Could not save the groups: ' + err.message));
    }

    // saveCurrentGroup stores the ticked repositories under a name, replacing
    // the group of that name when there is one.
    function saveCurrentGroup() {
      const name = document.getElementById('group-name').value.trim();
      if (!name) {
        showPickerError('A group needs a name.');
        return;
      }
      if (!pendingRepos.length) {
        showPickerError('Tick at least one repository to save a group.');
        return;
      }
      const group = { name, repositories: pendingRepos.slice() };
      const groups = repoGroups.filter(g => g.name.toLowerCase() !== name.toLowerCase()).concat([group]);
      saveGroups(groups).then(() => showGroupNameRow(false));
    }

    function deleteGroup(name) {
      if (!window.confirm(`Delete the group "${name}"?`)) return;
      saveGroups(repoGroups.filter(g => g.name !== name));
    }

    function syncUserField() {
      document.getElementById('f-user').disabled = document.getElementById('f-countall').checked;
    }

    function applyParams(e) {
      if (e) e.preventDefault();
      currentQuery = buildQuery();
      // Reflect the parameters in the page URL so it can be shared/bookmarked.
      history.replaceState(null, '', currentQuery || location.pathname);
      clearTimeout(pollTimer);
      loadStats().catch(showError);
      loadIdentity();
    }

    // drillDown filters the analysis to a single contributor, matching all of
    // their merged identities (names and emails).
    function drillDown(contributor) {
      const filter = (contributor.identities && contributor.identities.length)
        ? contributor.identities.join(',')
        : contributor.author;
      document.getElementById('f-countall').checked = false;
      document.getElementById('f-user').value = filter;
      syncUserField();
      applyParams();
    }

    function showError(err) {
      document.getElementById('app').innerHTML =
        '<p class="msg">Failed to load statistics: ' + err.message + '</p>';
    }

    // exportJSON downloads the currently displayed statistics as a JSON file,
    // dropping the transient cache-control fields.
    function exportJSON() {
      if (!lastData) return;
      const { stale, refreshing, ttlSeconds, ...clean } = lastData;
      const user = (clean.user || 'all').replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g, '').toLowerCase() || 'all';
      const blob = new Blob([JSON.stringify(clean, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = el('a', { href: url, download: `gitcontrib-${user}.json` });
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    // ---- Settings -----------------------------------------------------------
    // The analysis config — the repositories scanned first of all — can be
    // edited here and is applied by the server without a restart. Every change
    // needs the edit token the config file carries; without one the server
    // refuses to write anything, and this dialog stays read-only.

    const TOKEN_KEY = 'gitcontrib-edit-token';

    function editToken() {
      try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; }
    }

    function setEditToken(token) {
      try {
        if (token) localStorage.setItem(TOKEN_KEY, token);
        else localStorage.removeItem(TOKEN_KEY);
      } catch (e) { /* a browser refusing storage only forgets the token */ }
    }

    // authHeaders carries the edit token on the requests that write.
    function authHeaders(extra) {
      const headers = Object.assign({}, extra || {});
      const token = editToken();
      if (token) headers['X-Gitcontrib-Token'] = token;
      return headers;
    }

    // shortPath keeps the telling end of a long path, which is where a file
    // name lives.
    function shortPath(path, max = 56) {
      return path.length > max ? '…' + path.slice(path.length - max) : path;
    }

    function settingsMsg(message, kind) {
      const box = document.getElementById('settings-msg');
      box.textContent = message || '';
      box.className = 'settings-msg' + (kind ? ' ' + kind : '');
    }

    function loadConfig() {
      return fetch('api/config', { headers: authHeaders() })
        .then(r => (r.ok ? r.json() : null))
        .then(data => { if (data) configData = data; return data; });
    }

    function openSettings() {
      settingsMsg('');
      document.getElementById('settings').hidden = false;
      renderSettings();
      loadConfig().then(() => {
        configDraft = JSON.parse(JSON.stringify((configData && configData.config) || {}));
        renderSettings();
      });
    }

    function closeSettings() {
      document.getElementById('settings').hidden = true;
    }

    // sfield lays out one labelled input.
    function sfield(label, input, hint) {
      return el('div', { class: 'sfield' }, [
        el('label', {}, label),
        input,
        hint ? el('span', { class: 'hint' }, hint) : null,
      ]);
    }

    // textInput builds an input bound to a key of the config draft; an emptied
    // field removes the value, which brings the built-in default back.
    function textInput(key, attrs, parse) {
      const value = configDraft[key];
      const input = el('input', Object.assign({ type: 'text' }, attrs || {}));
      input.value = value === null || value === undefined ? '' : value;
      input.disabled = !canEdit();
      input.addEventListener('input', () => {
        const raw = input.value.trim();
        configDraft[key] = raw === '' ? null : (parse ? parse(raw) : raw);
      });
      return input;
    }

    function checkInput(key, label) {
      const box = el('input', { type: 'checkbox', id: 'cfg-' + key });
      box.checked = !!configDraft[key];
      box.disabled = !canEdit();
      box.addEventListener('change', () => { configDraft[key] = box.checked; });
      return el('div', { class: 'sfield check' }, [box, el('label', { for: 'cfg-' + key }, label)]);
    }

    function listInput(key) {
      const input = el('input', { type: 'text', placeholder: 'regex, comma-separated' });
      input.value = (configDraft[key] || []).join(', ');
      input.disabled = !canEdit();
      input.addEventListener('input', () => {
        configDraft[key] = input.value.split(',').map(v => v.trim()).filter(Boolean);
      });
      return input;
    }

    function canEdit() {
      return !!(configData && configData.authorized);
    }

    function renderSettings() {
      const body = document.getElementById('settings-body');
      body.innerHTML = '';
      const file = document.getElementById('settings-file');
      file.textContent = shortPath(configData ? configData.file : '');
      file.title = configData ? configData.file : '';
      document.getElementById('settings-save').disabled = !canEdit();

      if (!configData) {
        body.appendChild(el('p', { class: 'msg' }, [el('span', { class: 'spinner' }), 'Reading the configuration…']));
        return;
      }
      configDraft = configDraft || JSON.parse(JSON.stringify(configData.config || {}));

      body.appendChild(accessSection());
      body.appendChild(repositoriesSection());
      body.appendChild(defaultsSection());
      body.appendChild(serverSection());
    }

    // accessSection is the lock: it says why editing is refused, and takes the
    // token that lifts it.
    function accessSection() {
      if (!configData.editable) {
        return el('div', { class: 'notice warn', html:
          'This server is read-only: no edit token is configured. Add ' +
          '<code>"web": { "editToken": "…" }</code> to its config file and restart it to allow ' +
          'changes from here.' });
      }
      if (canEdit()) {
        const forget = el('button', { type: 'button', class: 'link' }, 'Forget the token on this browser');
        forget.addEventListener('click', () => {
          setEditToken('');
          loadConfig().then(renderSettings);
        });
        return el('div', { class: 'notice' }, [
          el('span', {}, 'Editing is unlocked on this browser. '), forget,
        ]);
      }

      const input = el('input', { type: 'password', id: 'cfg-token', placeholder: 'edit token' });
      const unlock = el('button', { type: 'button' }, 'Unlock');
      const submit = () => {
        setEditToken(input.value.trim());
        loadConfig().then(data => {
          if (data && data.authorized) settingsMsg('Editing unlocked.', 'ok');
          else { setEditToken(''); settingsMsg('That token was refused.', 'error'); }
          renderSettings();
        });
      };
      unlock.addEventListener('click', submit);
      input.addEventListener('keydown', event => { if (event.key === 'Enter') submit(); });

      return el('div', { class: 'notice' }, [
        el('p', { style: 'margin:0 0 8px' }, 'The settings below are read-only until you unlock them with the edit token from the config file.'),
        el('div', { class: 'srow' }, [el('span', { class: 'path' }, [input]), unlock]),
      ]);
    }

    // repositoriesSection edits the scanned folders: the list the server
    // analyzes, plus the field that resolves a path into repositories.
    function repositoriesSection() {
      const folders = configDraft.folders || [];
      const rows = folders.map(folder => {
        const remove = el('button', { type: 'button', class: 'icon', title: 'Remove this repository' }, '×');
        remove.disabled = !canEdit();
        remove.addEventListener('click', () => {
          configDraft.folders = (configDraft.folders || []).filter(f => f !== folder);
          renderSettings();
        });
        return el('div', { class: 'srow' }, [el('span', { class: 'path', title: folder }, folder), remove]);
      });
      if (!rows.length) {
        rows.push(el('div', { class: 'srow' }, [el('span', { class: 'path ro' }, 'No repository configured yet.')]));
      }

      const path = el('input', { type: 'text', id: 'cfg-repo-path', placeholder: '/path/to/repository or to a folder holding several' });
      path.disabled = !canEdit();
      path.addEventListener('keydown', event => { if (event.key === 'Enter') { event.preventDefault(); addRepository(); } });
      const add = el('button', { type: 'button' }, 'Add');
      add.disabled = !canEdit();
      add.addEventListener('click', addRepository);

      const children = [el('h3', {}, 'Repositories'), ...rows,
        el('div', { class: 'srow' }, [el('span', { class: 'path' }, [path]), add]),
        el('span', { class: 'hint' }, 'A folder that is not a repository is replaced by the repositories it holds. Paths may use ~ and $VARS.'),
      ];

      // What the server scans right now can differ from the file — a command
      // line, or a current repository taking precedence at startup.
      const scanned = configData.folders || [];
      if (scanned.length && folders.length && !sameList(scanned, folders)) {
        children.push(el('div', { class: 'notice', style: 'margin-top:10px' },
          `Right now the server analyzes ${scanned.join(', ')} — saving applies the list above.`));
      }
      return el('div', { class: 'sgroup' }, children);
    }

    function sameList(a, b) {
      return a.length === b.length && a.every((v, i) => v === b[i]);
    }

    // defaultsSection edits the analysis values the UI starts from.
    function defaultsSection() {
      return el('div', { class: 'sgroup' }, [
        el('h3', {}, 'Default analysis'),
        el('div', { class: 'sgrid' }, [
          sfield('Weeks', textInput('weeks', { type: 'number', min: '1', max: '520' }, Number), 'Empty: one year'),
          sfield('Delta', textInput('delta', { placeholder: 'e.g. 1y, 6m, 2w' }), 'Shifts the window into the past'),
          sfield('User', textInput('user', { placeholder: 'name or email' }), 'Empty: the git config user'),
          sfield('Include patterns', listInput('includePatterns')),
          sfield('Exclude patterns', listInput('excludePatterns')),
        ]),
        el('div', { class: 'sgrid', style: 'margin-top:12px' }, [
          checkInput('countAll', 'Count every contributor'),
          checkInput('merge', 'Merge the repositories into one result'),
        ]),
      ]);
    }

    // serverSection shows the settings that belong to how the server was
    // started: only the cache lifetime can change without restarting it.
    function serverSection() {
      const web = configData.web || {};
      return el('div', { class: 'sgroup' }, [
        el('h3', {}, 'Server'),
        el('div', { class: 'sgrid' }, [
          sfield('Cache lifetime', textInput('ttl', { placeholder: 'e.g. 30s, 5m, 1h' }), 'Applied as soon as it is saved'),
        ]),
        el('div', { class: 'srow', style: 'margin-top:10px' }, [
          el('span', { class: 'path ro' }, `Listening on ${web.addr || '—'} · cache ${web.cacheFile || '—'} · groups ${web.groupsFile || '—'}`),
        ]),
        el('span', { class: 'hint' }, 'These three follow the command line and need a restart to change.'),
      ]);
    }

    // addRepository asks the server what repositories a path holds, and adds
    // them to the list being edited (nothing is written before Save).
    function addRepository() {
      const input = document.getElementById('cfg-repo-path');
      const path = input.value.trim();
      if (!path) return;
      settingsMsg('Looking for repositories…');
      fetch('api/repositories/scan', {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ path }),
      }).then(r => {
        if (!r.ok) return r.text().then(t => { throw new Error(t.trim() || ('HTTP ' + r.status)); });
        return r.json();
      }).then(data => {
        const found = data.folders || [];
        const known = configDraft.folders || [];
        configDraft.folders = known.concat(found.filter(f => !known.includes(f)));
        input.value = '';
        renderSettings();
        settingsMsg(`${found.length} repositor${found.length === 1 ? 'y' : 'ies'} added — save to apply.`, 'ok');
      }).catch(err => settingsMsg(err.message, 'error'));
    }

    function saveSettings() {
      if (!canEdit()) return;
      settingsMsg('Saving…');
      fetch('api/config', {
        method: 'PUT',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ config: configDraft }),
      }).then(r => {
        if (r.status === 401) {
          setEditToken('');
          throw new Error('The edit token was refused. Unlock again to save.');
        }
        if (!r.ok) return r.text().then(t => { throw new Error(t.trim() || ('HTTP ' + r.status)); });
        return r.json();
      }).then(data => {
        configData = data;
        configDraft = JSON.parse(JSON.stringify(data.config || {}));
        settingsMsg('Saved. The new configuration is applied.', 'ok');
        renderSettings();
        // The scanned repositories may have changed: everything is re-read.
        loadGroups();
        loadStats().catch(showError);
        loadIdentity();
      }).catch(err => {
        settingsMsg(err.message, 'error');
        loadConfig().then(renderSettings);
      });
    }

    // ---- Identity cards ---------------------------------------------------
    // The identity of the repositories themselves: what they are, what their
    // whole history says about contributions, and how much code their current
    // version holds. They come from /api/identity, which does not depend on the
    // analysis window, so they are fetched (and cached) separately.

    function fmtInt(n) {
      return (n || 0).toLocaleString();
    }

    function fmtBytes(bytes) {
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let value = bytes || 0, unit = 0;
      while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit++; }
      return (unit === 0 ? value : value.toFixed(value < 10 ? 1 : 0)) + ' ' + units[unit];
    }

    function fmtAge(days) {
      if (!days) return '—';
      if (days >= 730) return (days / 365.25).toFixed(1) + ' years';
      if (days >= 60) return Math.round(days / 30.44) + ' months';
      return days + ' day' + (days === 1 ? '' : 's');
    }

    // A zero time.Time marshals as year 1: the repository has no such date.
    function fmtDay(iso) {
      return (!iso || iso.startsWith('0001-01-01')) ? '—' : fmtDate(iso);
    }

    function pct(value, total) {
      return (total > 0 ? Math.round((value / total) * 100) : 0) + '%';
    }

    function idRow(label, value, title) {
      const row = el('div', { class: 'idrow' }, [
        el('span', { class: 'k' }, label),
        el('span', { class: 'v' }, String(value)),
      ]);
      if (title) row.title = title;
      return row;
    }

    function idGroup(title, rows) {
      return el('div', { class: 'idgroup' }, [el('h4', {}, title)].concat(rows.filter(Boolean)));
    }

    // branchChip names the checked-out branch; long branch names are cut by
    // the chip's own ellipsis rather than pushing the other chips away.
    function branchChip(branch) {
      const c = chip(branch, 'Current branch: ' + branch);
      c.className = 'chip branch';
      return c;
    }

    function chip(children, title) {
      const c = el('span', { class: 'chip' }, children);
      if (title) c.title = title;
      return c;
    }

    // contributionRows summarizes the whole history of a repository.
    // windowCommits, when known, recalls how much of it the analyzed window
    // (with its current filters) covers.
    function contributionRows(history, windowCommits) {
      const h = history || {};
      const top = (h.topAuthors || [])[0];
      return [
        idRow('Commits', fmtInt(h.commits)),
        windowCommits == null ? null :
          idRow('In current window', fmtInt(windowCommits), 'Commits matching the parameters above'),
        idRow('Contributors', fmtInt(h.contributors)),
        top ? idRow('Top author', `${top.author} (${fmtInt(top.commits)})`, top.email) : null,
        idRow('First commit', fmtDay(h.firstCommit)),
        idRow('Last commit', fmtDay(h.lastCommit)),
        idRow('Age', fmtAge(h.ageInDays)),
        idRow('Active days', fmtInt(h.activeDays), 'Distinct days holding at least one commit'),
        idRow('Commits / week', (h.commitsPerWeek || 0).toFixed(1)),
        idRow('Merge commits', fmtInt(h.mergeCommits)),
      ];
    }

    // codeRows measures the current version of the code: the files tracked by
    // HEAD, vendored directories excluded.
    function codeRows(code) {
      const c = code || {};
      const deps = c.dependencies || [];
      const ecosystems = [...new Set(deps.map(d => d.ecosystem))].join(', ');
      const top = (c.languages || [])[0];
      return [
        idRow('Lines of code', fmtInt(c.codeLines), 'Lines of the source files, documentation and data excluded'),
        idRow('All lines', fmtInt(c.lines), 'Every text file tracked by HEAD'),
        top ? idRow('Main language', `${top.name} (${pct(top.lines, c.lines)})`) : null,
        idRow('Languages', fmtInt((c.languages || []).length)),
        idRow('Files', fmtInt(c.files), `${fmtInt(c.codeFiles)} source files · ${fmtInt(c.binaryFiles)} binary · ${fmtInt(c.vendored)} vendored files ignored`),
        idRow('Size', fmtBytes(c.bytes)),
        idRow('Packages', fmtInt(c.packages), 'Directories holding at least one source file'),
        idRow('Directories', fmtInt(c.directories)),
        idRow('Dependencies', c.totalDeps ? `${fmtInt(c.directDeps)} direct / ${fmtInt(c.totalDeps)}` : '—', ecosystems),
      ];
    }

    // languageBar draws the share of each language in the current code, by
    // lines, as a single stacked bar plus its legend.
    function languageBar(languages) {
      const langs = (languages || []).filter(l => l.lines > 0);
      if (!langs.length) return null;
      const total = langs.reduce((s, l) => s + l.lines, 0);
      const items = langs.slice(0, 6).map((l, i) => ({ label: l.name, value: l.lines, color: PALETTE[i % PALETTE.length] }));
      const rest = langs.slice(6).reduce((s, l) => s + l.lines, 0);
      if (rest > 0) items.push({ label: 'Other', value: rest, color: 'var(--border)' });

      const bar = el('div', { class: 'langbar' }, items.map(it => el('div', {
        style: `width:${(it.value / total) * 100}%;background:${it.color}`,
        title: `${it.label}: ${fmtInt(it.value)} lines (${pct(it.value, total)})`,
      })));
      const legend = el('div', { class: 'idlegend' }, items.map(it => el('span', { class: 'item' }, [
        el('span', { class: 'swatch', style: `background:${it.color}` }),
        `${it.label} ${pct(it.value, total)}`,
      ])));
      return el('div', {}, [bar, legend]);
    }

    function authorChips(authors) {
      if (!authors || !authors.length) return null;
      return el('div', { class: 'idchips' }, authors.map(a =>
        chip([a.author + ' ', el('b', {}, fmtInt(a.commits))], a.email)));
    }

    function dependencyChips(deps) {
      if (!deps || !deps.length) return null;
      return el('div', { class: 'idchips' }, deps.slice(0, 8).map(d => {
        const parts = [d.ecosystem + ' ', el('b', {}, fmtInt(d.direct)), ' direct'];
        if (d.indirect) parts.push(' · ', el('b', {}, fmtInt(d.indirect)), ' indirect');
        if (d.dev) parts.push(' · ', el('b', {}, fmtInt(d.dev)), ' dev');
        return chip(parts, d.manifest || d.ecosystem);
      }));
    }

    // canSelectRepo reports whether clicking a card can narrow the analysis to
    // that repository (it must be a scanned folder, and not the only one
    // already selected).
    function canSelectRepo(folder) {
      return !!folder && availableRepos.includes(folder) &&
        !(selectedRepos.length === 1 && selectedRepos[0] === folder);
    }

    function selectRepo(folder) {
      focusRepos([folder]);
    }

    // identityCard renders one repository's card.
    function identityCard(card, windowCommits) {
      let name = document.createTextNode(card.name);
      if (canSelectRepo(card.folder)) {
        name = el('button', { type: 'button', title: 'Analyze only this repository' }, card.name);
        name.addEventListener('click', () => selectRepo(card.folder));
      }

      const body = [
        el('div', { class: 'idhead' }, [
          el('h3', { class: 'idname' }, [name]),
          el('div', { class: 'idchips' }, [
            card.branch ? branchChip(card.branch) : null,
            card.tags ? chip([el('b', {}, fmtInt(card.tags)), ' tags']) : null,
            card.branches ? chip([el('b', {}, fmtInt(card.branches)), ' branches']) : null,
          ]),
        ]),
        el('div', {}, [
          el('div', { class: 'idmeta' }, card.path || card.folder),
          card.remote ? el('div', { class: 'idmeta' }, card.remote) : null,
          card.headSha ? el('div', { class: 'idmeta' },
            `HEAD ${card.headSha.slice(0, 7)} · ${card.headSubject} · ${fmtDay(card.headDate)}`) : null,
        ]),
      ];

      if (card.error) {
        body.push(el('div', { class: 'iderr' }, card.error));
        return el('div', { class: 'idcard' }, body);
      }

      body.push(el('div', { class: 'idcols' }, [
        idGroup('Contributions (all time)', contributionRows(card.history, windowCommits)),
        idGroup('Code (current version)', codeRows(card.code)),
      ]));
      body.push(languageBar((card.code || {}).languages));
      body.push(authorChips((card.history || {}).topAuthors));
      body.push(dependencyChips((card.code || {}).dependencies));
      return el('div', { class: 'idcard' }, body.filter(Boolean));
    }

    // overviewCard renders the identity of every scanned repository at once.
    function overviewCard(all, windowCommits) {
      const body = [
        el('div', { class: 'idhead' }, [
          el('h3', { class: 'idname' }, 'All repositories'),
          el('div', { class: 'idchips' }, [
            chip([el('b', {}, fmtInt(all.repositories)), ' repositories']),
            all.failed ? chip([el('b', {}, fmtInt(all.failed)), ' unreadable']) : null,
            all.tags ? chip([el('b', {}, fmtInt(all.tags)), ' tags']) : null,
            all.branches ? chip([el('b', {}, fmtInt(all.branches)), ' branches']) : null,
          ]),
        ]),
        el('div', { class: 'idcols' }, [
          idGroup('Contributions (all time)', contributionRows(all.history, windowCommits)),
          idGroup('Code (current version)', codeRows(all.code)),
        ]),
        languageBar((all.code || {}).languages),
        authorChips((all.history || {}).topAuthors),
        dependencyChips((all.code || {}).dependencies),
      ];
      return el('div', { class: 'idcard all' }, body.filter(Boolean));
    }

    // identitySection is the placeholder the cards are rendered into; it is
    // rebuilt with the rest of the page and filled from the last identity
    // payload, whether or not it has arrived yet.
    function identitySection() {
      return el('section', {}, [
        el('h2', { class: 'section-title' }, 'Identity'),
        el('div', { id: 'identity-body' }),
      ]);
    }

    // windowCommitsOf maps a repository folder to its commit count in the
    // analyzed window; a scanned folder absent from the results simply had no
    // commit. Merged results cover several folders at once, so they are left
    // out rather than attributed to one of them.
    function windowCommitsOf(folder) {
      if (!lastData || (lastData.params || {}).merge) return null;
      const match = (lastData.repositories || []).find(r => r.folder === folder);
      if (match) return match.commits;
      return (lastData.availableRepos || []).includes(folder) ? 0 : null;
    }

    function renderIdentity() {
      const body = document.getElementById('identity-body');
      if (!body) return;
      body.innerHTML = '';

      if (identityError) {
        body.appendChild(el('p', { class: 'msg' }, 'Failed to load the identity cards: ' + identityError));
        return;
      }
      if (!identityData) {
        body.appendChild(el('p', { class: 'msg' }, [el('span', { class: 'spinner' }), 'Reading the repositories…']));
        return;
      }

      const cards = identityData.repositories || [];
      const grid = el('div', { class: 'idgrid' });
      // With a single repository its card already is the whole picture.
      if (cards.length > 1) {
        grid.appendChild(overviewCard(identityData.all || {}, lastData ? lastData.totalCommits : null));
      }
      cards.forEach(card => grid.appendChild(identityCard(card, windowCommitsOf(card.folder))));
      body.appendChild(grid);
    }

    // loadIdentity fetches the cards for the selected repository (or all of
    // them), keeping the previous ones on screen unless the selection changed.
    function loadIdentity() {
      // The cards only depend on which repositories are looked at.
      const selection = new URLSearchParams();
      const query = new URLSearchParams(currentQuery.replace(/^\?/, ''));
      query.getAll('repo').forEach(repo => selection.append('repo', repo));
      if (query.get('group')) selection.set('group', query.get('group'));
      const key = selection.toString();
      if (key !== identityRepo) {
        identityRepo = key;
        identityData = null;
        renderIdentity();
      }
      identityError = null;
      clearTimeout(identityTimer);
      return fetch('api/identity' + (key ? '?' + key : ''))
        .then(r => {
          if (!r.ok) return r.text().then(t => { throw new Error(t.trim() || ('HTTP ' + r.status)); });
          return r.json();
        })
        .then(data => {
          identityData = data;
          renderIdentity();
          // A card being rebuilt in the background lands on the next poll.
          if (data.refreshing) identityTimer = setTimeout(loadIdentity, 3000);
        })
        .catch(err => { identityError = err.message; renderIdentity(); });
    }

    // emptyState explains a result holding no commit — which is a legitimate
    // answer, not a failure: it spells out the three filters that can empty a
    // view and offers to loosen the ones actually narrowing it. Selecting
    // repositories nobody has touched lately is the usual cause, and the
    // identity cards below give each repository's last commit.
    function emptyState(data) {
      const p = data.params || {};
      const repos = selectedRepos.length
        ? `${selectedRepos.length} of ${availableRepos.length} repositories (${selectedRepos.map(repoLabel).join(', ')})`
        : `${availableRepos.length || data.analyzedRepos} repositories`;
      const who = (p.countAll || !p.user) ? 'every contributor' : p.user;
      const when = `${fmtDate(data.beginOfScan)} → ${fmtDate(data.endOfScan)}`;

      const actions = [];
      if (selectedRepos.length) {
        actions.push(action('Analyze every repository', () => focusRepos([])));
      }
      if (!p.countAll && p.user) {
        actions.push(action('Count every contributor', () => {
          document.getElementById('f-countall').checked = true;
          syncUserField();
          applyParams();
        }));
      }
      const weeks = p.weeks || Math.round((data.durationInDays || 0) / 7) || 52;
      const wider = Math.min(520, Math.max(weeks * 4, 4));
      if (wider > weeks) {
        actions.push(action(`Look back ${wider} weeks`, () => {
