          document.getElementById('f-weeks').value = wider;
          applyParams();
        }));
      }

      return el('div', { class: 'empty' }, [
        el('h2', {}, 'No commits in this view'),
        el('p', {}, [
          'Nothing matched ',
          el('span', { class: 'filters' }, repos),
          ', ',
          el('span', { class: 'filters' }, who),
          ', ',
          el('span', { class: 'filters' }, when),
          '.',
        ]),
        el('p', {}, 'The repositories are there — they just hold no commit under these parameters. The identity cards below show when each of them was last touched.'),
        el('div', { class: 'actions' }, actions),
      ]);
    }

    function action(label, onClick) {
      const b = el('button', { type: 'button' }, label);
      b.addEventListener('click', onClick);
      return b;
    }

    function render(data) {
      lastData = data;
      syncAvailableRepos(data.availableRepos || []);
      document.getElementById('scan-info').textContent =
        `${data.user} · ${fmtDate(data.beginOfScan)} → ${fmtDate(data.endOfScan)}`;
      populateForm(data);
      updateStatusBar(data);
      scheduleAutoRefreshCheck(data);

      const app = document.getElementById('app');
      app.innerHTML = '';

      if (data.totalCommits === 0) {
        app.appendChild(emptyState(data));
        app.appendChild(identitySection());
        renderIdentity();
        return;
      }

      app.appendChild(el('div', { class: 'grid cards' }, [
        card(data.totalCommits, 'Commits'),
        card(data.analyzedRepos, 'Repositories'),
        card((data.contributors || []).length, 'Contributors'),
        card(data.durationInDays, 'Days scanned'),
      ]));

      app.appendChild(el('section', {}, [
        el('h2', { class: 'section-title' }, 'Highlights'),
        el('div', { class: 'grid cards' }, computeHighlights(data)),
      ]));

      app.appendChild(identitySection());
      renderIdentity();

      app.appendChild(el('section', {}, panel('Commit activity', calendar(data.calendar || []))));

      const trend = weeklyTrend(data.calendar || []);
      if (trend.length > 1) {
        app.appendChild(el('section', {}, panel('Commits over time (weekly)', trendChart(trend))));
      }

      const lines = weeklyLines(data.calendar || []);
      if (lines.length > 1 && lines.some(p => p.additions || p.deletions)) {
        app.appendChild(el('section', {}, panel('Lines changed over time (weekly)', linesChart(lines))));
      }

      const weekdayLabels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      const hourLabels = Array.from({ length: 24 }, (_, i) => String(i));
      app.appendChild(el('section', {}, el('div', { class: 'grid panels' }, [
        panel('Commits by weekday', barChart(data.commitsByWeekday, weekdayLabels)),
        panel('Commits by hour', barChart(data.commitsByHour, hourLabels)),
      ])));

      if (data.punchcard) {
        app.appendChild(el('section', {}, panel('Punchcard (weekday × hour)', punchcardChart(data.punchcard))));
      }

      const contribs = data.contributors || [];
      if (contribs.length) {
        app.appendChild(el('section', {}, el('div', { class: 'grid panels' }, [
          panel('Contributors', editionsTable(contribs, 'Contributor', c => c.author, drillDown)),
          panel('Contribution share', donutChart(contribs.map(c => ({ label: c.author, value: c.total })))),
        ])));
      }

      const langs = data.languages || [];
      if (langs.length) {
        app.appendChild(el('section', {}, el('div', { class: 'grid panels' }, [
          panel('Languages', editionsTable(langs, 'Language', l => l.name)),
          panel('Language share', donutChart(langs.map(l => ({ label: l.name, value: l.total })))),
        ])));
      }

      const types = data.commitTypes || [];
      if (types.length) {
        app.appendChild(el('section', {}, el('div', { class: 'grid panels' }, [
          panel('Commit types', countTable(types, 'Type', 'Commits', t => t.type, t => t.count)),
          panel('Commit type share', donutChart(types.map(t => ({ label: t.type, value: t.count })))),
        ])));
      }

      const repos = data.repositories || [];
      if (repos.length) {
        const list = el('table', {}, [
          el('thead', {}, el('tr', {}, [el('th', {}, 'Repository'), el('th', { class: 'num' }, 'Commits')])),
          el('tbody', {}, repos.map(r => el('tr', {}, [
            el('td', {}, r.folder),
            el('td', { class: 'num' }, String(r.commits)),
          ]))),
        ]);
        app.appendChild(el('section', {}, panel('Repositories', scrollable(list))));
      }
    }

    document.getElementById('refresh-btn').addEventListener('click', triggerRefresh);
    document.getElementById('settings-btn').addEventListener('click', openSettings);
    document.getElementById('settings-close').addEventListener('click', closeSettings);
    document.getElementById('settings-cancel').addEventListener('click', closeSettings);
    document.getElementById('settings-save').addEventListener('click', saveSettings);
    // A click on the backdrop, outside the dialog, closes it.
    document.getElementById('settings').addEventListener('click', event => {
      if (event.target.id === 'settings') closeSettings();
    });
    document.getElementById('export-btn').addEventListener('click', exportJSON);
    document.getElementById('params-form').addEventListener('submit', applyParams);
    document.getElementById('f-countall').addEventListener('change', syncUserField);

    document.getElementById('repo-btn').addEventListener('click', toggleRepoPanel);
    document.getElementById('repo-search').addEventListener('input', renderRepoPanel);
    // The panel lives inside the parameters form: Enter applies the selection
    // rather than submitting the form behind it.
    document.getElementById('repo-search').addEventListener('keydown', event => {
      if (event.key === 'Enter') { event.preventDefault(); applyRepoSelection(); }
    });
    document.getElementById('repo-all').addEventListener('click', () => {
      pendingRepos = availableRepos.slice();
      renderRepoPanel();
    });
    document.getElementById('repo-none').addEventListener('click', () => {
      pendingRepos = [];
      renderRepoPanel();
    });
    document.getElementById('repo-apply').addEventListener('click', applyRepoSelection);
    document.getElementById('group-save-toggle').addEventListener('click', () => showGroupNameRow(true));
    document.getElementById('group-cancel').addEventListener('click', () => showGroupNameRow(false));
    document.getElementById('group-save').addEventListener('click', saveCurrentGroup);
    document.getElementById('group-name').addEventListener('keydown', event => {
      if (event.key === 'Enter') { event.preventDefault(); saveCurrentGroup(); }
    });
    // The panel closes on a click outside of it, or on Escape. A click on a
    // node the panel has just redrawn away is not a click outside of it.
    document.addEventListener('click', event => {
      const field = document.getElementById('repo-field');
      if (!document.contains(event.target)) return;
      if (!field.contains(event.target)) closeRepoPanel();
    });
    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;
      if (!document.getElementById('settings').hidden) closeSettings();
      closeRepoPanel();
    });
    // Start from the parameters carried in the page URL, if any; the form is
    // then filled from the parameters the server echoes back.
    currentQuery = window.location.search;
    loadGroups();
    loadStats().catch(showError);
    loadIdentity();
  </script>
</body>
</html>
